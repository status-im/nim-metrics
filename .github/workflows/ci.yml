name: CI
on:
  push:
    branches:
      - master
      - test-minver
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@minver
    with:
      install-command: 'nimble --resolver:minver install -y --depsOnly'
      test-command: |
        nimble --requires:unittest2 test
        nimble --requires:unittest2 --requires:chronicles test_chronicles

  nph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check `nph` formatting
        uses: arnetheduck/nph-action@v1
        with:
          version: 0.7.0
